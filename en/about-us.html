<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="description" content="Discover the history of Trendfarm and our mission in developing innovative algorithms for quantitative trading and risk management.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Trendfarm</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        
        /* NAVBAR */
        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        
        /* LOGO COORDINATO (Immagine + Testo Bicolore) */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .img-logo {
            height: 38px;
            width: auto;
        }
        .testo-logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .colore-trend { color: #dca122; } /* Oro dal logo */
        .colore-farm { color: #ffffff; }  /* Bianco dal logo */

        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: rgba(255, 255, 255, 0.1); color: white; padding: 8px 16px; font-size: 1rem; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: rgba(0, 0, 0, 0.9); min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 0 0 4px 4px; z-index: 1; margin-top: 0; padding-top: 5px; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: flex; gap: 10px; font-size: 0.95rem; }
        .dropdown-content a:hover { background-color: #00bcd4; color: black; }
        .dropdown:hover .dropdown-content { display: block; }

        /* CONTENITORE CENTRALE */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 120px 20px 40px 20px;
        }

        /* RIQUADRO TRASPARENTE STILE VETRO SFOCATO */
        .scheda-contenuto {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);          
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            max-width: 800px;                     
            width: 100%;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center; 
        }

        /* TITOLO "ABOUT US" CENTRATO */
        .scheda-contenuto h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #00bcd4;                        
            border-bottom: 2px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 10px;
            text-align: center;
        }

        /* TESTO INTERNO CENTRATO */
        #testo-dinamico {
            font-size: 1.1rem;
            line-height: 1.8;                      
            color: #e0e0e0;
            white-space: pre-line; 
            text-align: center; 
        }

        /* Ottimizzazione Universale per Visualizzazione su Smartphone */
        @media (max-width: 768px) {
            /* 1. Gestione della Navbar e dei Menu verticali */
            .navbar { flex-direction: column; gap: 10px; padding: 15px; }
            .nav-container { flex-direction: column; gap: 10px; width: 100%; }
            .nav-links { flex-direction: column; gap: 12px; text-align: center; }
            
            /* 2. Gestione del Menu Lingue (Dropdown) */
            .dropdown { width: 100%; text-align: center; }
            .dropdown-btn { width: 100%; justify-content: center; }
            .dropdown-content { position: relative; width: 100%; }
            
            /* 3. Spaziatura del Contenitore Centrale */
            .main-content { padding: 160px 20px 40px 20px; }
            .scheda-contenuto { padding: 25px; }
            
            /* 4. RIMPCIOLLIMENTO DEI CARATTERI SU MOBILE */
            .titolo-principale { font-size: 2.2rem !important; line-height: 1.3 !important; }
            .scheda-contenuto h2 { font-size: 1.6rem !important; border-bottom-width: 1px !important; padding-bottom: 8px !important; }
            #testo-dinamico, #testo-altro, .testo-notifica { font-size: 0.95rem !important; line-height: 1.6 !important; }
            .nome-versione { font-size: 1.1rem !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <!-- AGGIORNATO: Struttura bicolore + Immagine Logo -->
        <a href="index.html" class="logo-container">
            <img src="../logo.png" alt="Logo Trendfarm" class="img-logo">
            <div class="testo-logo">
                <span class="colore-trend">TREND</span><span class="colore-farm">FARM</span>
            </div>
        </a>
        
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="about-us.html" style="color: #00bcd4;">About us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="prices.html">Prices</a></li>
                <li><a href="contacts.html">Contacts</a></li>
            </ul>
            <div class="dropdown">
                <button class="dropdown-btn">🇬🇧 English ▾</button>
                <div class="dropdown-content">
                    <a href="../it/index.html">🇮🇹 Italiano</a>
                    <a href="index.html">🇬🇧 English</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="scheda-contenuto">
            <h2>About Us</h2>
            <div id="testo-dinamico">Loading...</div>
        </div>
    </main>

    <script>
        // 1. Lettura dei file di testo dinamici
        fetch('testo-about-us.txt')
            .then(response => { if (!response.ok) throw new Error(); return response.text(); })
            .then(data => { 
                let testoFormattato = data.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                document.getElementById('testo-dinamico').innerHTML = testoFormattato; 
            })
            .catch(error => { document.getElementById('testo-dinamico').innerText = "Error loading content."; });
    </script>

</body>
</html>
