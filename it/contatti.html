    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        
        /* NAVBAR */
        .navbar { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
        
        /* LOGO COORDINATO (Immagine + Testo Bicolore) */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .img-logo {
            height: 38px;
            width: auto;
        }
        .testo-logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .colore-trend { color: #dca122; } /* Oro dal logo */
        .colore-farm { color: #ffffff; }  /* Bianco dal logo */

        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: rgba(255, 255, 255, 0.1); color: white; padding: 8px 16px; font-size: 1rem; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: rgba(0, 0, 0, 0.9); min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 0 0 4px 4px; z-index: 1; margin-top: 0; padding-top: 5px; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: flex; gap: 10px; font-size: 0.95rem; }
        .dropdown-content a:hover { background-color: #00bcd4; color: black; }
        .dropdown:hover .dropdown-content { display: block; }

        /* CONTENITORE CENTRALE */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 140px 20px 40px 20px;
        }

        .scheda-contenuto {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);          
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            max-width: 600px; /* Più stretto per i moduli */
            width: 100%;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scheda-contenuto h2 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: #00bcd4;                        
            border-bottom: 2px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 10px;
            text-align: center;
        }

        /* STRUTTURA DEL MODULO (FORM) */
        .form-gruppo {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-gruppo label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e0e0e0;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #00bcd4;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Scatola di selezione per l'oggetto personalizzabile */
        select.form-control {
            cursor: pointer;
        }
        select.form-control option {
            background-color: #1a1a1a; /* Colore scuro per i testi del menu a discesa */
            color: white;
        }

        .btn-invia {
            width: 100%;
            padding: 14px;
            background-color: #00bcd4;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-invia:hover {
            background-color: #ffffff;
        }

        /* Ottimizzazione Universale per Visualizzazione su Smartphone */
        @media (max-width: 768px) {
            /* 1. Gestione della Navbar e dei Menu verticali */
            .navbar { flex-direction: column; gap: 10px; padding: 15px; }
            .nav-container { flex-direction: column; gap: 10px; width: 100%; }
            .nav-links { flex-direction: column; gap: 12px; text-align: center; }
            
            /* 2. Gestione del Menu Lingue (Dropdown) */
            .dropdown { width: 100%; text-align: center; }
            .dropdown-btn { width: 100%; justify-content: center; }
            .dropdown-content { position: relative; width: 100%; }
            
            /* 3. Spaziatura del Contenitore Centrale */
            .main-content { padding: 160px 20px 40px 20px; }
            .scheda-contenuto { padding: 25px; }
            
            /* 4. RIMPCIOLLIMENTO DEI CARATTERI SU MOBILE */
            .titolo-principale { font-size: 2.2rem !important; line-height: 1.3 !important; }
            .scheda-contenuto h2 { font-size: 1.6rem !important; border-bottom-width: 1px !important; padding-bottom: 8px !important; }
            #testo-dinamico, #testo-altro, .testo-notifica { font-size: 0.95rem !important; line-height: 1.6 !important; }
            .nome-versione { font-size: 1.1rem !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <!-- AGGIORNATO: Struttura bicolore + Immagine Logo -->
        <a href="index.html" class="logo-container">
            <img src="../logo.png" alt="Logo Trendfarm" class="img-logo">
            <div class="testo-logo">
                <span class="colore-trend">TREND</span><span class="colore-farm">FARM</span>
            </div>
        </a>
        
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="chi-siamo.html">Chi siamo</a></li>
                <li><a href="prodotti.html">Prodotti</a></li>
                <li><a href="prezzi.html">Prezzi</a></li>
                <li><a href="contatti.html" style="color: #00bcd4;">Contatti</a></li>
            </ul>
            <div class="dropdown">
                <button class="dropdown-btn">🇮🇹 Italiano ▾</button>
                <div class="dropdown-content">
                    <a href="index.html">🇮🇹 Italiano</a>
                    <a href="../en/index.html">🇬🇧 English</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="scheda-contenuto">
            <h2>Contattaci</h2>
            
            <!-- FORM AGGIORNATO PER REINDIRIZZAMENTO AJAX ILLIMITATO -->
            <form class="form-contatti-ajax">
                
                <div class="form-gruppo">
                    <label for="nome">Nome / Azienda</label>
                    <input type="text" name="user_name" id="nome" class="form-control" placeholder="Inserisci il tuo nome" required>
                </div>

                <div class="form-gruppo">
                    <label for="email">Indirizzo Email</label>
                    <input type="email" name="user_email" id="email" class="form-control" placeholder="nome@esempio.com" required>
                </div>

                <div class="form-gruppo">
                    <label for="oggetto">Oggetto della richiesta</label>
                    <select name="subject" id="oggetto" class="form-control" required>
                        <option value="" disabled selected>Seleziona un'opzione...</option>
                        <option value="Informazioni Generali">Informazioni Generali</option>
                        <option value="Informazioni Commerciali">Informazioni Commerciali</option>
                        <option value="Richiesta Preventivo">Richiesta Preventivo</option>
                        <option value="Assistenza Tecnica">Assistenza Tecnica</option>
                        <option value="Altro">Altro motivo</option>
                    </select>
                </div>

                <div class="form-gruppo">
                    <label for="messaggio">Messaggio</label>
                    <textarea name="message" id="messaggio" class="form-control" rows="5" placeholder="Scrivi qui la tua richiesta..." required></textarea>
                </div>

                <button type="submit" class="btn-invia">Invia Messaggio</button>
            </form>

        </div>
    </main>

    <script>
        // NUOVA LOGICA AJAX PER FORMSUBMIT CONTATTI SENZA SCHERMATE BIANCHE
        const formContatti = document.querySelector('.form-contatti-ajax');
        if (formContatti) {
            formContatti.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const submitBtn = formContatti.querySelector('.btn-invia');
                const vecchioTesto = submitBtn.innerText;
                
                submitBtn.innerText = "Invio in corso...";
                submitBtn.disabled = true;

                // Creazione del pacchetto dati specifico per FormSubmit
                const formData = new FormData();
                formData.append('name', formContatti.querySelector('#nome').value);
                formData.append('email', formContatti.querySelector('#email').value);
                formData.append('subject', formContatti.querySelector('#oggetto').value);
                formData.append('message', formContatti.querySelector('#messaggio').value);
                formData.append('_captcha', 'false'); // Disattiva i robot visivi di controllo

                // Spedizione asincrona all'endpoint di FormSubmit italiano
                fetch('https://formsubmit.co/info@trendfarm.it', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                })
                .then(response => {
                    formContatti.reset();
                    // Successo: si salta alla pagina di gestione messaggi col tasto OK
                    window.location.href = 'messaggio-inviato.html';
                })
                .catch(error => {
                    // Sicurezza: forza il redirect anche in caso di intoppi di rete
                    formContatti.reset();
                    window.location.href = 'messaggio-inviato.html';
                });
            });
        }
    </script>
</body>
</html>
