<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Piattaforma di trading automatico professionale con 5 motori strategici indipendenti. Scarica la versione TRIAL gratuita per 30 giorni.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendfarm</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="canonical" href="https://trendfarm-labs.github.io/trendfarm/index.html">
    <link rel="alternate" hreflang="it" href="https://trendfarm-labs.github.io/trendfarm/it/index.html">
    <link rel="alternate" hreflang="en" href="https://trendfarm-labs.github.io/trendfarm/en/index.html">
    <link rel="alternate" hreflang="x-default" href="https://trendfarm-labs.github.io/trendfarm/index.html">   
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container-sicurezza {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .img-logo {
            height: 45px;
            width: auto;
        }
        .testo-logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .colore-trend { color: #dca122; }
        .colore-farm { color: #ffffff; }
        .links-lingua {
            font-size: 1.1rem;
            margin-top: 20px;
        }
        .links-lingua a {
            color: #0b2f8f;
            text-decoration: none;
            font-weight: 600;
            padding: 5px 10px;
            transition: color 0.2s;
        }
        .links-lingua a:hover {
            color: #00bcd4;
        }
        
        /* Ottimizzazione Universale per Visualizzazione su Smartphone */
        @media (max-width: 768px) {
            /* 1. Gestione della Navbar e dei Menu verticali */
            .navbar { flex-direction: column; gap: 10px; padding: 15px; }
            .nav-container { flex-direction: column; gap: 10px; width: 100%; }
            .nav-links { flex-direction: column; gap: 12px; text-align: center; }
            
            /* 2. Gestione del Menu Lingue (Dropdown) */
            .dropdown { width: 100%; text-align: center; }
            .dropdown-btn { width: 100%; justify-content: center; }
            .dropdown-content { position: relative; width: 100%; }
            
            /* 3. Spaziatura del Contenitore Centrale */
            .main-content { padding: 160px 20px 40px 20px; }
            .scheda-contenuto { padding: 25px; }
            
            /* 4. RIMPCIOLLIMENTO DEI CARATTERI SU MOBILE */
            .titolo-principale { font-size: 2.2rem !important; line-height: 1.3 !important; }
            .scheda-contenuto h2 { font-size: 1.6rem !important; border-bottom-width: 1px !important; padding-bottom: 8px !important; }
            #testo-dinamico, #testo-altro, .testo-notifica { font-size: 0.95rem !important; line-height: 1.6 !important; }
            .nome-versione { font-size: 1.1rem !important; }
        }
    </style>
    <script>
        // Rileva la lingua del browser
        var lingua = navigator.language || navigator.userLanguage; 
        
        // Se la lingua inizia con "it", vai alla cartella italiana, altrimenti vai in inglese
        if (lingua.indexOf('it') === 0) {
            window.location.href = "./it/index.html";
        } else {
            window.location.href = "./en/index.html";
        }
    </script>
</head>
<body>

    <!-- Contenuto di sicurezza se i JavaScript sono disattivati -->
    <div class="container-sicurezza">
        <div class="logo-box">
            <img src="logo.png" alt="Logo Trendfarm" class="img-logo">
            <div class="testo-logo">
                <span class="colore-trend">TREND</span><span class="colore-farm">FARM</span>
            </div>
        </div>
        <div class="links-lingua">
            <a href="./it/index.html">🇮🇹 Italiano</a> | <a href="./en/index.html">🇬🇧 English</a>
        </div>
    </div>

</body>
</html>
